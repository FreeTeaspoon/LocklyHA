name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --output-format github

  tests:
    name: Frame, MQTT and Vision checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt

      # The suites import the integration, which imports Home Assistant, so the
      # real thing is installed rather than stubbed. They need no network, no
      # broker and no hardware: every frame is asserted against a plaintext
      # layout, and the MQTT tests drive a fake client.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Frame builders and parsers
        run: python tests/test_frame.py
        env:
          PYTHONPATH: .

      - name: MQTT exchange and state callbacks
        run: python tests/test_exchange.py
        env:
          PYTHONPATH: .

      - name: Vision protocol, ordering and lifecycle
        run: python tests/test_vision.py
        env:
          PYTHONPATH: .

      - name: Camera decode and lifecycle
        run: python tests/test_camera.py
        env:
          PYTHONPATH: .

      - name: Access management, settings preservation and credential privacy
        run: python tests/test_management.py
        env:
          PYTHONPATH: .

      - name: Fingerprint, eKey, one-use PIN and media safety
        run: python tests/test_vision_extensions.py
        env:
          PYTHONPATH: .

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Private access card controls and camera cleanup
        run: |
          npm ci --prefix tests --ignore-scripts --no-audit --no-fund
          node tests/test_card.mjs
